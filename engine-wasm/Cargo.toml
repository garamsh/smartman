[package]
name = "smartman_engine_wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "The smartman engine as a WebAssembly module for the web app."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
smartman_engine = { path = "../engine" }
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
# Exact: the wasm-bindgen CLI that generates pkg/ and runs the tests must be this release.
wasm-bindgen = "=0.2.129"

[dev-dependencies]
serde_json = "1.0.154"
wasm-bindgen-test = "=0.3.79"

# Symbol names carry hashes of the checkout path; stripping them keeps pkg/ the same on every host.
[profile.release]
strip = true
