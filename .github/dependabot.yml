version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pub"
    directory: "/app"
    schedule:
      interval: "weekly"
    ignore:
      # Coupled to the bridge crate and the codegen; the PM moves all three in one PR (docs/architecture/study.md).
      - dependency-name: "flutter_rust_bridge*"
  - package-ecosystem: "cargo"
    directory: "/engine"
    schedule:
      interval: "weekly"
  - package-ecosystem: "rust-toolchain"
    directory: "/engine"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/app/rust"
    schedule:
      interval: "weekly"
    ignore:
      # Coupled to the pub packages and the codegen; the PM moves all three in one PR (docs/architecture/study.md).
      - dependency-name: "flutter_rust_bridge*"
      # Breaks backtrace on iOS: https://github.com/rust-lang/libc/issues/5601
      - dependency-name: "libc"
        versions: ["= 0.2.190"]
  - package-ecosystem: "rust-toolchain"
    directory: "/app/rust"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/engine-wasm"
    schedule:
      interval: "weekly"
    groups:
      # Released together and pinned to each other; one moved alone does not resolve (docs/architecture/engine.md).
      wasm-bindgen:
        patterns:
          - "wasm-bindgen*"
          - "js-sys"
  - package-ecosystem: "rust-toolchain"
    directory: "/engine-wasm"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    ignore:
      # typescript-eslint 8.71.2 accepts TypeScript below 6.1 (docs/architecture/web.md).
      - dependency-name: "typescript"
        versions: [">= 6.1"]
      # eslint-plugin-react, -import and -jsx-a11y, which eslint-config-next 16.4.1 brings, accept ESLint 9 at most.
      - dependency-name: "eslint"
        versions: [">= 10"]
      # Node's types follow the Node release in web/.nvmrc, which the PM moves (README).
      - dependency-name: "@types/node"
        versions: [">= 25"]
  - package-ecosystem: "docker"
    directory: "/web"
    schedule:
      interval: "weekly"
