version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pub"
    directory: "/app"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/engine"
    schedule:
      interval: "weekly"
  - package-ecosystem: "rust-toolchain"
    directory: "/engine"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/app/rust"
    schedule:
      interval: "weekly"
  - package-ecosystem: "rust-toolchain"
    directory: "/app/rust"
    schedule:
      interval: "weekly"
