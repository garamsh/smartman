name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the iOS simulator build that links the bridge library.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: app/pubspec.yaml
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rust-src-dir: engine
      # The codegen release is the flutter_rust_bridge crate's in the bridge crate's lock file.
      - id: frb
        run: echo "version=$(sed -n '/^name = "flutter_rust_bridge"$/{n;s/^version = "\(.*\)"$/\1/p;}' app/rust/Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: flutter_rust_bridge_codegen@${{ steps.frb.outputs.version }}
          fallback: cargo-install
      - run: make ci
